<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meal Prep Planner</title>
  <meta name="description" content="Plan quick, balanced, high-protein meals; weekend prep, grocery lists and nutrition tracking.">
  <meta name="theme-color" content="#0e7a5a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Meal Prep">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="app"><p class="muted">Loading…</p></main>
  <div class="timers" id="timers"></div>
  <nav class="tabs" id="tabs">
    <a href="#/" data-tab="today"><span class="ico">🏠</span>Today</a>
    <a href="#/plan" data-tab="plan"><span class="ico">🗓️</span>Plan</a>
    <a href="#/prep" data-tab="prep"><span class="ico">🛒</span>Prep</a>
    <a href="#/recipes" data-tab="recipes"><span class="ico">📖</span>Recipes</a>
    <a href="#/me" data-tab="me"><span class="ico">👤</span>Me</a>
  </nav>
  <div id="sheet-root"></div>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
